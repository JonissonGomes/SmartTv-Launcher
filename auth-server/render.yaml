# Deploy a partir da raiz do monorepo (não use Root Directory = auth-server).
# Build gera a SPA em auth-server/public para o QR do celular.
services:
  - type: web
    name: smarttv-auth
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build && node scripts/copyRelayAssets.mjs && npm ci --prefix auth-server
    startCommand: npm start --prefix auth-server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: smarttv-launcher
      - key: JWT_AUDIENCE
        value: smarttv-launcher
      - key: CORS_ORIGIN
        value: "*"
      - key: AUTH_DEV_BYPASS
        value: "0"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
